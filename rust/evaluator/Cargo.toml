[package]
name = "studab27-evaluator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bigdecimal = "0.4.11"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
